<!DOCTYPE html>
<html>

<head>
    <title>Integrate With Straits</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            padding:40px;
            width:400px;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:20px;
            background:#ff7a59;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        .employee-box{
            background:#f8f8f8;
            padding:15px;
            border-radius:8px;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

    <div class="card">

        <h2>🚀 Integrate With Straits</h2>

        <div class="employee-box">

            <p><b>Name:</b> {{ employee.full_name }}</p>

            <p><b>Email:</b> {{ employee.email }}</p>

            <p><b>Role:</b> {{ employee.role }}</p>

        </div>

        <form method="POST">

            <input
                type="email"
                name="org_email"
                placeholder="Organization Email"
                required
            >

            <input
                type="password"
                name="org_password"
                placeholder="Organization Password"
                required
            >

            <button type="submit">

                Create Employee In Straits

            </button>

        </form>

    </div>

</body>

</html>
